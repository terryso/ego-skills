name: Skill request
description: Propose a new ego-browser skill before scaffolding it.
title: "skill: "
body:
  - type: markdown
    attributes:
      value: |
        Propose the skill before you scaffold it. 先开 issue，再跑 `npm run new-skill -- <id>`。

        This repository accepts **ego-browser** skills only. Anything else belongs in [claw-skills](https://github.com/terryso/claw-skills) or your own repository (`npx skills add`).

        A maintainer will reply with accepted, duplicate, or out of scope, and may add the `skill-request` label by hand.
  - type: input
    id: site
    attributes:
      label: Site or product
      description: Which site should this skill drive inside Ego Lite?
      placeholder: example.com
    validations:
      required: true
  - type: input
    id: skill-id
    attributes:
      label: Proposed skill id
      description: Lowercase directory name, hyphens allowed (my-site-download). Not a name starting with _.
      placeholder: my-site-download
    validations:
      required: true
  - type: dropdown
    id: login
    attributes:
      label: Does the happy path require a logged-in Ego session?
      options:
        - "Yes — login-check first, soft-fail exit 2"
        - "No — public pages only"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Skill kind
      options:
        - Download (the logged-in Ego session saves media the user can already see)
        - Publish (caller supplies a local file; name the success state)
        - Draft-only (never click the platform Publish control; WeChat Channels is always this)
        - Other ego-browser flow
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success state
      description: What can a human observe when the run worked? Video publish must name it (under review, private URL, draft saved, publish-success copy). WeChat Channels must stay draft-only and must not auto-click 发表.
      placeholder: Draft saved, or a private video URL plus a processing status.
    validations:
      required: true
  - type: textarea
    id: tos
    attributes:
      label: Terms-of-service self-check
      description: What this skill will not do. No password entry, no captcha farm, no credential harvest, no terms bypass, no downloader inside a publish skill.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The primary path is ego-browser (not Playwright, Puppeteer, or a cloud-browser MCP).
          required: true
        - label: Examples will use /tmp or /absolute/path/to/video.mp4, not a personal home directory.
          required: true
