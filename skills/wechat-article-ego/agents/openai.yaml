interface:
  display_name: "WeChat article draft"
  short_description: "Save one Official Account article or 贴图 draft via Ego Lite. --yes required. Never publishes."
  default_prompt: "Use wechat-article-ego: check-login first (exit 2 means stop). One mp.weixin.qq.com article draft, or one 贴图 draft with --kind tietu, per run. Nothing uploads without --yes. 贴图 mode clicks 保存为草稿 only and keeps external URLs as plain text. If more than one Official Account is visible, stop and report the names. Never click 发表, 群发, 定时群发, or 发送预览. Never type a password."
